services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: noirlol
      POSTGRES_USER: noirlol
      POSTGRES_PASSWORD: noirlol
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads
    command: sh -c "npx prisma db push && npm start"
volumes:
  postgres_data:
  uploads:
